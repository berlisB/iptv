name: iptv
description: "Lecteur IPTV performant basé sur des fichiers M3U"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^17.1.0

  # Video Player (performant HLS/IPTV)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_video: ^1.0.10

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # HTTP
  http: ^1.2.2

  # Utils
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

  # EPG (parsing XMLTV en streaming)
  xml: ^6.5.0

  # WebView (lecture VOD embed)
  webview_flutter: ^4.10.0

  # File picker (sous-titres externes)
  file_picker: ^8.1.7

  path: ^1.9.0

  # Telegram (TDLib embarqué : lecture des mp4 du canal, sans serveur).
  #
  # DÉSACTIVÉ VOLONTAIREMENT. La lib native est servie par GitHub Packages
  # Maven, qui exige une authentification même pour un paquet public : tant que
  # cette ligne est active, TOUT build Android échoue sur un 401, y compris
  # pour qui ne se sert pas du canal Telegram. Une fonctionnalité optionnelle
  # ne doit pas bloquer la livraison des autres.
  #
  # Pour réactiver : décommenter ci-dessous, puis échanger les deux
  # implémentations dans lib/features/telegram/data/ (voir le mode d'emploi en
  # tête de tdlib_client.dart). Un token GitHub avec le scope read:packages
  # sera alors nécessaire dans ~/.gradle/gradle.properties.
  #
  # libtdjson: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/playlists/
    - assets/catalog/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/google_fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Poppins-Black.ttf
          weight: 900
